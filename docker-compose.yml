services:
  mongo:
    image: mongo:7
    container_name: quiosque-mongodb
    restart: unless-stopped
    # Cache reduzido: a VPS tem 1 GB de RAM.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: quiosque-api:latest
    build: .
    container_name: quiosque-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/quiosque
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no .env}
    # Publica apenas no loopback: o Caddy da VPS faz o proxy HTTPS.
    # Se não houver proxy na VPS, troque por "4000:4000".
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - default
      - edge

networks:
  edge:
    external: true

volumes:
  mongodb_data:
