services:
  api:
    image: quiosque-api:latest
    build: .
    container_name: quiosque-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # MongoDB gerenciado (Atlas): a string vem do .env da VPS.
      MONGODB_URI: ${MONGODB_URI:?defina MONGODB_URI no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no .env}
    # Publica apenas no loopback: o Caddy da VPS faz o proxy HTTPS.
    # Se não houver proxy na VPS, troque por "4000:4000".
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - default
      - edge

networks:
  edge:
    external: true
