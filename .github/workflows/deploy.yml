name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A VPS tem 2 vCPU e ~1 GB de RAM; o build passa de 10 min em pico.
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git pull --ff-only
            # O banco é MongoDB Atlas; a VPS roda apenas o container da API.
            # --wait falha o job se a API não ficar healthy.
            docker compose build api
            docker compose up -d --wait --wait-timeout 180
            docker image prune -f
            docker compose ps
