name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git pull --ff-only
            # Sobe a stack inteira (mongo + api) para que um ambiente novo
            # funcione no primeiro deploy; --wait falha o job se algum
            # container não ficar healthy.
            docker compose build api
            docker compose up -d --wait --wait-timeout 180
            docker image prune -f
            docker compose ps
